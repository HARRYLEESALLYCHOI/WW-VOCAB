<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2A3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vocab Master">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Vocab Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#2A3A5C; --navy-soft:rgba(42,58,92,0.08); --orange:#E2613C; --cream:#F7F3EA;
  --card:#FBF8F3; --paper:#FAF7F2; --ink:#2A3A5C; --sub:#5B6B87; --green:#3F8A5F; --red:#C8483A; --purple:#8A6BAE;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%; background:#111; font-family:'Inter',system-ui,sans-serif;}
a{color:#3D5480;}
button{font-family:inherit;}
.serif{font-family:'Zilla Slab',serif;}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes growBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.stage{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;}
.phone{width:100%; max-width:402px; height:100vh; max-height:874px; border-radius:36px; overflow:hidden; box-shadow:0 30px 60px rgba(0,0,0,0.35); position:relative; background:var(--cream);}
@media (min-width:460px){ .phone{ border-radius:44px; } }

.screen{position:absolute; inset:0; display:flex; flex-direction:column; background:var(--cream); animation:screenIn .3s ease;}
.header{background:var(--navy); padding:28px 24px 22px; display:flex; align-items:center; gap:14px; flex-shrink:0;}
.header .back{border:none; background:transparent; cursor:pointer; padding:4px; display:flex;}
.htitle{font-family:'Zilla Slab',serif; font-weight:700; font-size:26px; color:#F8F5F0; line-height:1.1;}
.hsub{font-size:12.5px; color:rgba(248,245,240,0.65); margin-top:2px;}
.body{flex:1; overflow:auto; padding:16px 20px 100px;}
.body.pb0{padding-bottom:20px;}

.row{display:flex; align-items:center; justify-content:space-between; padding:16px 4px; border-bottom:1px solid rgba(42,58,92,0.1); cursor:pointer;}
.rowtitle{font-family:'Zilla Slab',serif; font-weight:700; font-size:18px; color:var(--navy);}
.rowsub{font-size:13px; color:var(--sub); margin-top:3px;}
.chev path{stroke:#5B6B87; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round;}

.pill{border:none; border-radius:100px; cursor:pointer; font-weight:700;}
.pill-primary{background:var(--orange); color:#FAF7F2; box-shadow:0 10px 24px rgba(226,97,60,0.35);}
.pill-outline{background:transparent; border:1.5px solid rgba(42,58,92,0.25); color:var(--navy);}

.card{background:var(--card); border-radius:18px; padding:20px; cursor:pointer; box-shadow:0 2px 10px rgba(42,58,92,0.07); margin-bottom:14px;}
.card.dark{background:var(--navy); box-shadow:0 6px 18px rgba(42,58,92,0.25);}
.card-title{font-family:'Zilla Slab',serif; font-weight:700; font-size:19px; color:var(--navy);}
.card.dark .card-title{color:#F8F5F0;}
.card-desc{font-size:13px; color:var(--sub); margin-top:7px; line-height:1.5;}
.card.dark .card-desc{color:rgba(248,245,240,0.7);}
.badge{font-size:11px; font-weight:700; color:var(--orange); background:rgba(226,97,60,0.12); padding:4px 9px; border-radius:100px;}
.badge.solid{color:#FAF7F2; background:var(--orange);}

.speakbtn{width:32px; height:32px; border-radius:50%; border:none; background:rgba(42,58,92,0.07); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.speakbtn.lg{width:44px; height:44px; background:var(--orange); box-shadow:0 6px 14px rgba(226,97,60,0.32);}

.tabbar{position:absolute; left:0; right:0; bottom:0; height:74px; background:var(--card); border-top:1px solid rgba(42,58,92,0.1); display:flex; align-items:center;}
.tabbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; border:none; background:transparent; padding:6px 0;}
.tabbtn .lbl{font-size:10.5px; font-weight:700; letter-spacing:0.4px;}

.modal-back{position:absolute; inset:0; background:rgba(42,58,92,0.5); display:flex; align-items:flex-end; justify-content:center; z-index:20;}
.modal-back.center{align-items:center; padding:24px;}
.sheet{width:100%; background:var(--card); border-radius:24px 24px 0 0; padding:24px 24px 40px; box-sizing:border-box; animation:sheetUp .25s ease;}
.popcard{width:100%; background:var(--card); border-radius:24px; padding:24px 22px 26px; box-sizing:border-box; animation:popIn .22s ease; box-shadow:0 20px 50px rgba(0,0,0,0.3);}
.grabber{width:36px; height:4px; border-radius:2px; background:rgba(42,58,92,0.2); margin:0 auto 18px;}

input[type=text]{width:100%; box-sizing:border-box; padding:14px 16px; border-radius:12px; border:1px solid rgba(42,58,92,0.2); font-size:16px; font-family:'Inter',sans-serif; color:var(--navy);}

.opt{display:flex; gap:12px; align-items:flex-start; padding:15px 16px; border-radius:14px; cursor:pointer; background:var(--paper); border:1.5px solid rgba(42,58,92,0.13); margin-bottom:10px;}
.opt .n{font-family:'Zilla Slab',serif; font-weight:700; font-size:14px; color:var(--sub); flex-shrink:0; line-height:1.45;}
.opt .t{font-size:15px; color:var(--navy); line-height:1.45;}
.opt.correct{background:rgba(63,138,95,0.12); border-color:var(--green);}
.opt.correct .n, .opt.correct .t{color:#26603F;}
.opt.wrong{background:rgba(200,72,58,0.1); border-color:var(--red);}
.opt.wrong .n, .opt.wrong .t{color:#8E2F24;}

.statbox{flex:1; background:var(--card); border-radius:16px; padding:16px;}
.statnum{font-family:'Zilla Slab',serif; font-weight:700; font-size:30px; color:var(--navy); line-height:1;}
.statlbl{font-size:11.5px; color:var(--sub); margin-top:5px; letter-spacing:0.4px;}
.sectionlbl{font-size:12px; font-weight:700; letter-spacing:0.8px; color:var(--sub); margin:26px 0 14px;}

::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div class="stage"><div class="phone" id="phone"></div></div>

<script>
/* ============ DATA ============ */
const BOOK8 = [
  { word:'avid', pos:'adj.', pron:'/av\'id/', ko:'매우 열망하는; 열렬한', en:'having a strong desire for something, to the point of greed, or eager and enthusiastic', ex:'Kiara is an avid skateboarder who spends every weekend at the park.', syn:'enthusiastic', lesson:1 },
  { word:'brusque', pos:'adj.', pron:'/brusk/', ko:'퉁명스러운; 무뚝뚝한', en:'abrupt and blunt in manner or speech', ex:'The coach gave a brusque reply and walked off the field.', syn:'curt', lesson:1 },
  { word:'concise', pos:'adj.', pron:'/kuhn-sis\'/', ko:'간결한', en:'short and to the point', ex:'Her concise summary covered every key point in two sentences.', syn:'brief', lesson:1 },
  { word:'demean', pos:'v.', pron:'/di-meen\'/', ko:'품위를 떨어뜨리다; 비하하다', en:'to lower someone\'s self-esteem or reputation', ex:'He refused to demean himself by arguing with the crowd.', syn:'degrade', lesson:1 },
  { word:'despicable', pos:'adj.', pron:'/des-pik\'uh-bul/', ko:'비열한; 경멸스러운', en:'deserving contempt or scorn', ex:'Stealing from a friend is a despicable thing to do.', syn:'contemptible', lesson:1 },
  { word:'emulate', pos:'v.', pron:'/em\'yoo-lat/', ko:'본받다; 모방하다', en:'to try to equal by imitation', ex:'Young players often try to emulate their favorite professional athletes.', syn:'imitate', lesson:1 },
  { word:'evoke', pos:'v.', pron:'/i-vok\'/', ko:'불러일으키다; 유발하다', en:'to call forth or bring to mind', ex:'The old photograph seemed to evoke memories of her childhood home.', syn:'elicit', lesson:1 },
  { word:'excruciating', pos:'adj.', pron:'/eks-kroo\'shee-a-ting/', ko:'극심하게 고통스러운', en:'extremely painful', ex:'The results turned out to be excruciating beyond what anyone expected.', syn:'agonizing', lesson:1 },
  { word:'inaugurate', pos:'v.', pron:'/i-nog\'yuh-rat/', ko:'취임시키다; 공식적으로 개시하다', en:'to install in office formally, or to begin officially', ex:'It took real effort for the team to inaugurate through the final week.', syn:'launch', lesson:1 },
  { word:'pervade', pos:'v.', pron:'/pur-vad\'/', ko:'퍼지다; 가득 차다', en:'to spread throughout something', ex:'A strange calm seemed to pervade the empty hallway.', syn:'permeate', lesson:1 },
  { word:'proprietor', pos:'n.', pron:'/pruh-pri\'uh-tur/', ko:'소유주; 사업주', en:'an owner of a business', ex:'Her speech opened with a memorable a proprietor.', syn:'owner', lesson:1 },
  { word:'pseudonym', pos:'n.', pron:'/soo\'duh-nim/', ko:'필명; 가명', en:'a fictitious name used by a writer', ex:'The report described a pseudonym that surprised the readers.', syn:'alias', lesson:1 },
  { word:'rebuff', pos:'v.', pron:'/ri-buf\'/', ko:'퉁명스럽게 거절하다; 격퇴하다', en:'to reject bluntly', ex:'It took real effort for the team to rebuff through the final week.', syn:'spurn', lesson:1 },
  { word:'resilient', pos:'adj.', pron:'/ri-zil\'yunt/', ko:'회복력 있는; 탄력 있는', en:'able to recover quickly from hardship', ex:'The critics called the new design surprisingly resilient.', syn:'tough', lesson:1 },
  { word:'turbulent', pos:'adj.', pron:'/tur\'byuh-lunt/', ko:'혼란스러운; 격동의', en:'chaotic or stormy', ex:'Everyone agreed that his approach was remarkably turbulent.', syn:'chaotic', lesson:1 },
  { word:'abrasion', pos:'n.', pron:'/uh-bra\'zhun/', ko:'마찰에 의한 마모; 찰과상', en:'a scraped area caused by rubbing', ex:'The report described an abrasion that surprised the readers.', syn:'scrape', lesson:2 },
  { word:'clad', pos:'adj.', pron:'/klad/', ko:'옷을 입은; 덮인', en:'dressed or covered', ex:'Her explanation was so clad that no one had further questions.', syn:'dressed', lesson:2 },
  { word:'corroborate', pos:'v.', pron:'/kuh-rob\'uh-rat/', ko:'증거로 뒷받침하다; 확증하다', en:'to support with evidence', ex:'Two separate witnesses managed to corroborate the same story.', syn:'confirm', lesson:2 },
  { word:'cursory', pos:'adj.', pron:'/kur\'suh-ree/', ko:'서둘러서 대충 하는; 소홀한', en:'hasty and lacking attention to detail', ex:'Everyone agreed that his approach was remarkably cursory.', syn:'hasty', lesson:2 },
  { word:'dehydrate', pos:'v.', pron:'/dee-hi\'drat/', ko:'수분을 제거하다; 탈수시키다', en:'to remove water from something, or to lose bodily fluids', ex:'The intense heat began to dehydrate the hikers quickly.', syn:'desiccate', lesson:2 },
  { word:'derive', pos:'v.', pron:'/di-riv\'/', ko:'얻다; 유래하다', en:'to obtain from a source, or to originate', ex:'Much of the town\'s income seemed to derive from tourism.', syn:'stem', lesson:2 },
  { word:'electrify', pos:'v.', pron:'/i-lek\'truh-fi/', ko:'전기를 연결하다; 짜릿하게 흥분시키다', en:'to wire with electricity, or to thrill', ex:'The final goal seemed to electrify the entire stadium.', syn:'thrill', lesson:2 },
  { word:'endeavor', pos:'v.', pron:'/en-dev\'ur/', ko:'열심히 노력하다; 시도하다', en:'to make an earnest attempt', ex:'The scientists continued to endeavor toward a lasting cure.', syn:'strive', lesson:2 },
  { word:'gingerly', pos:'adj.', pron:'/jin\'jur-lee/', ko:'조심스러운; 신중한', en:'very cautious', ex:'The results turned out to be gingerly beyond what anyone expected.', syn:'cautious', lesson:2 },
  { word:'grimace', pos:'v.', pron:'/grim\'us/', ko:'얼굴을 찡그리다', en:'to twist the face to show pain or disgust', ex:'He could not help but grimace at the bitter taste.', syn:'wince', lesson:2 },
  { word:'gruesome', pos:'adj.', pron:'/groo\'sum/', ko:'소름 끼치는; 섬뜩한', en:'causing horror; extremely unpleasant', ex:'The critics called the new design surprisingly gruesome.', syn:'grisly', lesson:2 },
  { word:'inventory', pos:'n.', pron:'/in\'vun-tor-ee/', ko:'물품 목록; 재고', en:'a complete list of goods on hand', ex:'Her speech opened with a memorable an inventory.', syn:'stock', lesson:2 },
  { word:'simulate', pos:'v.', pron:'/sim\'yuh-lat/', ko:'~인 척하다; 모의 실험하다', en:'to imitate the appearance of something', ex:'Engineers used software to simulate the crash conditions.', syn:'mimic', lesson:2 },
  { word:'succumb', pos:'v.', pron:'/suh-kum\'/', ko:'굴복하다; 사망하다', en:'to give in, or to die', ex:'Even the strongest players eventually succumb to fatigue late in the match.', syn:'yield', lesson:2 },
  { word:'surmise', pos:'v.', pron:'/sur-miz\'/', ko:'추측하다; 짐작하다', en:'to guess without full evidence', ex:'Reporters like to surmise strong reactions from their readers.', syn:'guess', lesson:2 },
  { word:'anonymous', pos:'adj.', pron:'/uh-non\'uh-mus/', ko:'익명의', en:'of unknown or unrevealed source', ex:'Everyone agreed that his approach was remarkably anonymous.', syn:'unnamed', lesson:3 },
  { word:'anthology', pos:'n.', pron:'/an-thol\'uh-jee/', ko:'선집; 작품 모음집', en:'a collection of writings', ex:'The report described an anthology that surprised the readers.', syn:'collection', lesson:3 },
  { word:'conjecture', pos:'n.', pron:'/kun-jek\'chur/', ko:'추측; 억측', en:'a guess based on insufficient evidence', ex:'Everyone in the room noticed a conjecture right away.', syn:'speculation', lesson:3 },
  { word:'disposition', pos:'n.', pron:'/dis-puh-zish\'un/', ko:'기질; 성향', en:'a usual mood or a tendency', ex:'The article focused on a disposition from the town\'s history.', syn:'temperament', lesson:3 },
  { word:'encompass', pos:'v.', pron:'/en-kum\'pus/', ko:'둘러싸다; 포함하다', en:'to enclose, or to include', ex:'Teachers often encompass students to work harder before exams.', syn:'include', lesson:3 },
  { word:'extricate', pos:'v.', pron:'/ek\'struh-kat/', ko:'곤경에서 빠져나오게 하다', en:'to free from a difficult situation', ex:'The committee decided to extricate the plan after a long debate.', syn:'disentangle', lesson:3 },
  { word:'generation', pos:'n.', pron:'/jen-uh-ra\'shun/', ko:'세대; 세대 간 평균 나이 간격', en:'one stage in a family line, or the average span between parent and child', ex:'Everyone in the room noticed a generation right away.', syn:'age group', lesson:3 },
  { word:'guile', pos:'n.', pron:'/gil/', ko:'교활함; 간계', en:'cunning or deceit', ex:'The article focused on a guile from the town\'s history.', syn:'cunning', lesson:3 },
  { word:'imperative', pos:'adj.', pron:'/im-per\'uh-tiv/', ko:'긴급한; 명령적인', en:'urgent, or having authority to command', ex:'Everyone agreed that his approach was remarkably imperative.', syn:'urgent', lesson:3 },
  { word:'instill', pos:'v.', pron:'/in-stil\'/', ko:'서서히 심어주다; 주입시키다', en:'to introduce gradually and establish firmly', ex:'The committee decided to instill the plan after a long debate.', syn:'implant', lesson:3 },
  { word:'modify', pos:'v.', pron:'/mod\'uh-fi/', ko:'완화하다; 변경하다; 수식하다', en:'to make less extreme, or to change, or to limit meaning in grammar', ex:'It took real effort for the team to modify through the final week.', syn:'adjust', lesson:3 },
  { word:'pivot', pos:'n.', pron:'/piv\'ut/', ko:'축; 중심인물', en:'a point on which something turns', ex:'The article focused on a pivot from the town\'s history.', syn:'axis', lesson:3 },
  { word:'prevalent', pos:'adj.', pron:'/prev\'uh-lunt/', ko:'널리 퍼진; 흔한', en:'widely occurring; commonly accepted', ex:'Everyone agreed that his approach was remarkably prevalent.', syn:'widespread', lesson:3 },
  { word:'recur', pos:'v.', pron:'/ri-kur\'/', ko:'다시 일어나다; 재발하다', en:'to happen again', ex:'The same dream seemed to recur every night that week.', syn:'reoccur', lesson:3 },
  { word:'spontaneous', pos:'adj.', pron:'/spon-ta\'nee-us/', ko:'자발적인; 자연발생적인', en:'unplanned, or occurring naturally', ex:'Her explanation was so spontaneous that no one had further questions.', syn:'impulsive', lesson:3 },
  { word:'abhor', pos:'v.', pron:'/ab-hor\'/', ko:'혐오하다; 몹시 싫어하다', en:'to hate intensely', ex:'Most critics seemed to abhor the film\'s ending.', syn:'detest', lesson:4 },
  { word:'affable', pos:'adj.', pron:'/af\'uh-bul/', ko:'상냥한; 붙임성 있는', en:'pleasant and easy to talk to', ex:'Everyone agreed that his approach was remarkably affable.', syn:'amiable', lesson:4 },
  { word:'amiss', pos:'adv.', pron:'/uh-mis\'/', ko:'잘못되어; 순서가 어긋난', en:'wrong or out of order', ex:'The old door creaked open, and something felt amiss about it.', syn:'awry', lesson:4 },
  { word:'despondent', pos:'adj.', pron:'/di-spon\'dunt/', ko:'낙담한; 의기소침한', en:'deeply discouraged; without hope', ex:'Her explanation was so despondent that no one had further questions.', syn:'dejected', lesson:4 },
  { word:'entreat', pos:'v.', pron:'/en-treet\'/', ko:'간청하다; 애원하다', en:'to ask earnestly; to beg', ex:'Reporters like to entreat strong reactions from their readers.', syn:'implore', lesson:4 },
  { word:'haunt', pos:'v.', pron:'/hont/', ko:'마음속에 계속 맴돌다; 자주 드나들다', en:'to remain in the mind, to visit often, or to appear as a ghost', ex:'The unanswered question continued to haunt him for years.', syn:'plague', lesson:4 },
  { word:'impel', pos:'v.', pron:'/im-pel\'/', ko:'몰아가다; 촉구하다', en:'to drive forward, or to urge someone to act', ex:'The committee decided to impel the plan after a long debate.', syn:'compel', lesson:4 },
  { word:'interminable', pos:'adj.', pron:'/in-tur\'mi-nuh-bul/', ko:'끝없는; 지루하게 계속되는', en:'seemingly endless', ex:'Her explanation was so interminable that no one had further questions.', syn:'endless', lesson:4 },
  { word:'irascible', pos:'adj.', pron:'/i-ras\'uh-bul/', ko:'화를 잘 내는; 성마른', en:'quick-tempered', ex:'The critics called the new design surprisingly irascible.', syn:'irritable', lesson:4 },
  { word:'profound', pos:'adj.', pron:'/pruh-fownd\'/', ko:'강렬한; 심오한', en:'deeply felt, or showing great understanding', ex:'Everyone agreed that his approach was remarkably profound.', syn:'deep', lesson:4 },
  { word:'recluse', pos:'n.', pron:'/rek\'loos/', ko:'은둔자', en:'a person who lives apart from society', ex:'The report described a recluse that surprised the readers.', syn:'hermit', lesson:4 },
  { word:'reverberate', pos:'v.', pron:'/ri-vur\'buh-rat/', ko:'메아리치다; 울려 퍼지다', en:'to echo or resound', ex:'The explosion seemed to reverberate through the entire valley.', syn:'resound', lesson:4 },
  { word:'sage', pos:'adj.', pron:'/saj/', ko:'지혜로운; 현명한', en:'wise', ex:'The critics called the new design surprisingly sage.', syn:'wise', lesson:4 },
  { word:'tirade', pos:'n.', pron:'/ti\'rad/', ko:'장황하고 격렬한 비난', en:'a long, angry speech', ex:'Her speech opened with a memorable a tirade.', syn:'diatribe', lesson:4 },
  { word:'tremulous', pos:'adj.', pron:'/trem\'yuh-lus/', ko:'떨리는; 겁먹은', en:'shaking, or timid', ex:'The results turned out to be tremulous beyond what anyone expected.', syn:'shaky', lesson:4 },
  { word:'audacious', pos:'adj.', pron:'/o-da\'shus/', ko:'대담한; 무례한', en:'bold and willing to take risks, or disrespectful', ex:'Her explanation was so audacious that no one had further questions.', syn:'daring', lesson:5 },
  { word:'confiscate', pos:'v.', pron:'/kon\'fi-skat/', ko:'압수하다; 몰수하다', en:'to seize by authority', ex:'Security had to confiscate the banned items at the gate.', syn:'seize', lesson:5 },
  { word:'conscientious', pos:'adj.', pron:'/kon-shee-en\'shus/', ko:'철저한; 양심적인', en:'thorough and careful, or honest', ex:'Everyone agreed that his approach was remarkably conscientious.', syn:'diligent', lesson:5 },
  { word:'depict', pos:'v.', pron:'/di-pikt\'/', ko:'묘사하다; 그려내다', en:'to describe or picture', ex:'The committee decided to depict the plan after a long debate.', syn:'portray', lesson:5 },
  { word:'embark', pos:'v.', pron:'/em-bark\'/', ko:'탑승하다; 착수하다', en:'to board a ship or plane, or to begin something', ex:'The crew was ready to embark on the long voyage.', syn:'commence', lesson:5 },
  { word:'inkling', pos:'n.', pron:'/ing\'kling/', ko:'어렴풋한 낌새; 막연한 짐작', en:'a vague idea or slight suspicion', ex:'The article focused on an inkling from the town\'s history.', syn:'hint', lesson:5 },
  { word:'lackadaisical', pos:'adj.', pron:'/lak-uh-da\'zi-kul/', ko:'열의 없는; 무기력한', en:'lacking enthusiasm; unconcerned', ex:'Everyone agreed that his approach was remarkably lackadaisical.', syn:'listless', lesson:5 },
  { word:'mutiny', pos:'n.', pron:'/myoot\'n-ee/', ko:'반란; 항명', en:'open rebellion against authority', ex:'The report described a mutiny that surprised the readers.', syn:'revolt', lesson:5 },
  { word:'pilfer', pos:'v.', pron:'/pil\'fur/', ko:'좀도둑질하다', en:'to steal small amounts repeatedly', ex:'Someone had begun to pilfer supplies from the storage room.', syn:'filch', lesson:5 },

  meaning: { label:'MEANING', name:'Word to Meaning', color:'#2A3A5C' },
  blank:   { label:'BLANK',   name:'Fill the Blank', color:'#E2613C' },
  odd:     { label:'ODD ONE', name:'Find the Wrong Word', color:'#3F8A5F' },
  synonym: { label:'SYNONYM', name:'동의어', color:'#8A6BAE' },
};
const STORE = 'vocabmaster.v3.stats';
const LONG_PRESS_MS = 480;

function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }
function pick(a,n){ return shuffle(a).slice(0,n); }
function lessonWords(n){ return BOOK8.filter(w=>w.lesson===n); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let audioCtx = null;
function beep(kind){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const seq = kind === 'right' ? [[660,0],[880,0.09]] : kind === 'wrong' ? [[300,0],[200,0.11]] : [[520,0],[660,0.08],[880,0.16]];
    seq.forEach(([f,t]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = kind === 'wrong' ? 'sawtooth' : 'triangle';
      o.frequency.value = f;
      const s = audioCtx.currentTime + t;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.16, s + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.17);
      o.connect(g); g.connect(audioCtx.destination); o.start(s); o.stop(s + 0.2);
    });
  } catch (e) {}
}
function speak(text){
  try {
    if (!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1;
    const v = window.speechSynthesis.getVoices().find(x=>/en(-|_)US/i.test(x.lang));
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}
function swapWord(sentence, from, to){
  let out = sentence.split(from).join(to);
  const vowel = /^[aeiou]/i.test(to);
  out = out.replace(new RegExp('\\b(a|an|A|An)\\s+' + to + '\\b', 'g'), (m, art) => {
    const cap = art[0] === 'A';
    const fixed = vowel ? 'an' : 'a';
    return (cap ? fixed[0].toUpperCase() + fixed.slice(1) : fixed) + ' ' + to;
  });
  return out;
}
function makeQuestion(type, pool, all, forced){
  if (type === 'meaning'){
    const w = forced || pick(pool,1)[0];
    const wrongs = pick(all.filter(x=>x.word!==w.word),3);
    return { type, word:w.word, instruction:'What does this word mean?', prompt:w.word, promptSize:'34px',
      choices: shuffle([{text:w.en,correct:true},...wrongs.map(x=>({text:x.en,correct:false}))]) };
  }
  if (type === 'blank'){
    const w = forced || pick(pool,1)[0];
    const wrongs = pick(all.filter(x=>x.word!==w.word),3);
    return { type, word:w.word, instruction:'Choose the word that fits the blank.',
      prompt: w.ex.split(w.word).join('______'), promptSize:'20px',
      choices: shuffle([{text:w.word,correct:true},...wrongs.map(x=>({text:x.word,correct:false}))]) };
  }
  if (type === 'synonym'){
    const w = forced || pick(pool,1)[0];
    const wrongs = pick(all.filter(x=>x.word!==w.word),3);
    return { type, word:w.word, instruction:'Which word is closest in meaning?', prompt:w.word, promptSize:'34px',
      choices: shuffle([{text:w.syn,correct:true},...wrongs.map(x=>({text:x.syn,correct:false}))]) };
  }
  const source = all.length >= 5 ? all : BOOK8;
  const target = forced || pick(source,1)[0];
  const rest = pick(source.filter(x=>x.word!==target.word),4);
  const badIdx = Math.floor(Math.random()*5);
  const five = [...rest.slice(0,badIdx), target, ...rest.slice(badIdx)];
  const bad = five[badIdx];
  const swap = pick(source.filter(x=>x.word!==bad.word),1)[0];
  return { type:'odd', word:bad.word, instruction:'One sentence uses the wrong word. Find it.', prompt:'Which one is incorrect?', promptSize:'19px',
    choices: five.map((x,i)=>({ text: i===badIdx ? swapWord(x.ex, x.word, swap.word) : x.ex, correct: i===badIdx })) };
}

function beginTypedTest(kind){
  const ln = S.testLesson || 1;
  const pool = lessonWords(ln);
  let qs;
  if (kind === 'mix'){
    qs = shuffle([
      ...pick(pool,3).map(w=>makeQuestion('meaning',pool,BOOK8,w)),
      ...pick(pool,3).map(w=>makeQuestion('blank',pool,BOOK8,w)),
      ...pick(pool,3).map(w=>makeQuestion('odd',pool,BOOK8,w)),
    ]);
  } else {
    qs = shuffle(pool.map(w=>makeQuestion(kind,pool,BOOK8,w)));
  }
  beep('start');
  go('quiz', { quizTitle:'LESSON '+ln, questions:qs, qIdx:0, score:0, missed:[], locked:false, chosen:null });
}

function startBigTest(){
  const qs = shuffle([
    ...Array.from({length:8},()=>makeQuestion('odd',BOOK8,BOOK8)),
    ...Array.from({length:7},()=>makeQuestion('synonym',BOOK8,BOOK8)),
  ]);
  beep('start');

}

function quitQuiz(){ go('testHub', {tab:'test'}); }

function answer(id){
  if (S.locked) return;
  const q = S.questions[S.qIdx];
  const ok = !!q.choices[id].correct;
  beep(ok ? 'right' : 'wrong');
  if (!ok) S.missed.push(q.word);
  S.locked = true; S.chosen = id; S.score += ok?1:0;
  if (!ok) recordWrong(q.word, q.type); else recordRight(q.type);
  render();
  setTimeout(()=>{
    const next = S.qIdx+1;
    if (next >= S.questions.length) finishQuiz();
    else { S.qIdx=next; S.locked=false; S.chosen=null; render(); }
  }, ok ? 520 : 900);
}
function recordWrong(word, type){
  S.stats.wrong[word] = (S.stats.wrong[word]||0)+1;
  const t = S.stats.byType[type] || {right:0,total:0};
  S.stats.byType[type] = { right:t.right, total:t.total+1 };
  S.stats.total += 1;
  if (!S.stats.queue.includes(word)) S.stats.queue.push(word);
  save();
}
function recordRight(type){
  const t = S.stats.byType[type] || {right:0,total:0};
  S.stats.byType[type] = { right:t.right+1, total:t.total+1 };
  S.stats.total += 1; S.stats.right += 1;
  save();
}
function finishQuiz(){
  const pct = Math.round(S.score/S.questions.length*100);
  S.stats.tests += 1;
  S.stats.history = [...S.stats.history, {pct, label:S.quizTitle.split(' ')[0].slice(0,6)}].slice(-6);
  save();
  go('result', {locked:false, chosen:null});
}

function startReview(){
  const q = S.stats.queue;
  if (q.length < 10) return;
  beep('start');
  S.reviewOpen = true; S.reviewSession = q.slice(); S.reviewCleared = 0; S.reviewLocked=false; S.reviewChosen=null;
  S.rq = buildReviewQ(q[0]);
  render();
}
function buildReviewQ(word){
  const w = BOOK8.find(x=>x.word===word) || BOOK8[0];
  return makeQuestion(Math.random()<0.5?'meaning':'blank',[w],BOOK8);
}
function reviewAnswer(id){
  if (S.reviewLocked) return;
  const ok = !!S.rq.choices[id].correct;
  beep(ok?'right':'wrong');
  S.reviewLocked=true; S.reviewChosen=id;
  render();
  setTimeout(()=>{
    const session = S.reviewSession.slice();
    const cur = session.shift();
    if (ok){ S.reviewCleared += 1; S.stats.queue = S.stats.queue.filter(x=>x!==cur); }
    else { session.push(cur); S.stats.wrong[cur]=(S.stats.wrong[cur]||0)+1; S.stats.queue = S.stats.queue.filter(x=>x!==cur).concat([cur]); }
    save();
    S.reviewSession = session; S.reviewLocked=false; S.reviewChosen=null;
    const done = S.reviewCleared >= 5 || session.length === 0;
    S.rq = done ? null : buildReviewQ(session[0]);
    render();
  }, ok ? 520 : 900);
}
function closeReview(){ S.reviewOpen=false; S.rq=null; S.reviewSession=[]; S.reviewCleared=0; render(); }
function resetStats(){ S.stats = { tests:0, right:0, total:0, wrong:{}, byType:{}, history:[], queue:[] }; save(); render(); }

  let cells = '';
  for (let i=1;i<=20;i++) cells += `<div style="background:var(--card);border-radius:14px;padding:18px 0;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(42,58,92,0.07);" onclick="startLessonTest(${i})">
      <div class="serif" style="font-weight:700;font-size:22px;color:var(--navy);">${i}</div>
      <div style="font-size:10.5px;color:var(--sub);margin-top:2px;letter-spacing:0.5px;">LESSON</div>
    </div>`;
  return `<div class="screen">
    <div class="header"><button class="back" onclick="goTestHub()">${BACK}</button>
      <div><div class="htitle" style="font-size:24px;">SELECT LESSON</div><div class="hsub">Book 8 · 20 lessons</div></div></div>
    <div class="body" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start;">${cells}</div>
  </div>`;
}

function screenTestType(){
  return `<div class="screen">
    <div class="header"><button class="back" onclick="goTestLessonPick()">${BACK}</button>
      <div><div class="htitle" style="font-size:24px;">TEST TYPE</div><div class="hsub">Book 8 · Lesson ${S.testLesson}</div></div></div>
    <div class="body">
      <div class="card" style="border-left:4px solid var(--navy);" onclick="beginTypedTest('meaning')">
        <div style="display:flex;align-items:center;justify-content:space-between;"><div class="card-title">Word to Meaning</div><span style="font-size:11px;font-weight:700;color:var(--sub);">5 Q</span></div>
        <div class="card-desc">See the English word, pick the correct meaning.</div>
      </div>
      <div class="card" style="border-left:4px solid var(--orange);" onclick="beginTypedTest('blank')">
        <div style="display:flex;align-items:center;justify-content:space-between;"><div class="card-title">Fill the Blank</div><span style="font-size:11px;font-weight:700;color:var(--sub);">5 Q</span></div>
        <div class="card-desc">Choose the word that completes the sentence.</div>
      </div>
      <div class="card" style="border-left:4px solid var(--green);" onclick="beginTypedTest('odd')">
        <div style="display:flex;align-items:center;justify-content:space-between;"><div class="card-title">Find the Wrong Word</div><span style="font-size:11px;font-weight:700;color:var(--sub);">5 Q</span></div>
        <div class="card-desc">Five sentences, one uses the wrong word. Spot it.</div>
      </div>
      <div class="card dark" onclick="beginTypedTest('mix')">
        <div style="display:flex;align-items:center;justify-content:space-between;"><div class="card-title">All Three Mixed</div><span class="badge solid">9 Q</span></div>
        <div class="card-desc">Three of each type, shuffled together.</div>
      </div>
    </div>
  </div>`;
}

function screenQuiz(){
  const total = S.questions.length || 1;
  const q = S.questions[S.qIdx] || { typeLabel:'', instruction:'', prompt:'', promptSize:'28px', choices:[], type:'meaning' };
  const qType = TYPES[q.type] || TYPES.meaning;
  const opts = optionStyles(q.choices, S.locked, S.chosen);
  const pct = Math.round(S.qIdx/total*100);
  const canSpeak = q.type==='meaning'||q.type==='synonym';
  return `<div class="screen">
    <div class="header" style="flex-direction:column;align-items:stretch;padding:28px 24px 20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <button class="back" onclick="quitQuiz()"><svg width="15" height="15" viewBox="0 0 15 15"><path d="M1 1l13 13M14 1L1 14" stroke="#F8F5F0" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
        <div style="font-size:13px;font-weight:600;color:rgba(248,245,240,0.8);">${esc(S.quizTitle)}</div>
        <div class="serif" style="font-weight:700;font-size:16px;color:#F8F5F0;">${S.qIdx+1}/${total}</div>
      </div>
      <div style="height:5px;border-radius:3px;background:rgba(248,245,240,0.2);margin-top:16px;overflow:hidden;"><div style="height:100%;background:var(--orange);border-radius:3px;width:${pct}%;"></div></div>
    </div>
    <div style="padding:22px 24px 6px;">
      <span class="badge">${qType.label}</span>
      <div style="font-size:14px;color:var(--sub);margin-top:14px;line-height:1.5;">${esc(q.instruction)}</div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:8px;">
        <div class="serif" style="font-weight:700;font-size:${q.promptSize};color:var(--navy);line-height:1.3;">${esc(q.prompt)}</div>
        ${canSpeak?`<button class="speakbtn" style="width:38px;height:38px;" onclick="speak('${esc(q.word)}')">${SPEAK_ICON_D}</button>`:''}
      </div>
    </div>
    <div class="body">${opts.map(o=>`<div class="opt ${o.cls}" onclick="answer(${o.id})"><div class="n">${o.num}</div><div class="t">${esc(o.text)}</div></div>`).join('')}</div>
  </div>`;
}

function screenResult(){
  const total = S.questions.length || 1;
  const msg = S.score===total ? 'Perfect run.' : S.score/total>=0.7 ? 'Solid. A few to clean up.' : 'These words need another pass.';
  const missedWords = Array.from(new Set(S.missed)).map(w=>{ const b=BOOK8.find(x=>x.word===w)||{}; return { word:w, ko:b.en||'' }; });
  const list = missedWords.length ? missedWords.map(m=>`<div style="padding:14px 16px;background:var(--cream);border-radius:12px;border-left:3px solid var(--red);margin-bottom:10px;"><div class="serif" style="font-weight:700;font-size:17px;color:var(--navy);">${esc(m.word)}</div><div style="font-size:13px;color:var(--sub);margin-top:3px;">${esc(m.ko)}</div></div>`).join('')
    : `<div style="font-size:14px;color:var(--sub);padding:18px;background:var(--cream);border-radius:12px;">Nothing missed. All answers correct.</div>`;
  return `<div class="screen" style="background:#FBF8F3;">
    <div style="background:var(--navy);padding:44px 28px 34px;">
      <div style="font-size:13px;color:rgba(248,245,240,0.65);letter-spacing:1px;">${esc(S.quizTitle)} · RESULT</div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-top:10px;">
        <div class="serif" style="font-weight:700;font-size:60px;color:#F8F5F0;line-height:1;">${S.score}</div>
        <div class="serif" style="font-weight:700;font-size:22px;color:rgba(248,245,240,0.55);">/ ${total}</div>
      </div>
      <div style="font-size:14px;color:rgba(248,245,240,0.75);margin-top:8px;">${msg}</div>
    </div>
    <div class="body" style="padding:22px 24px 20px;">
      <div class="sectionlbl" style="margin-top:0;">MISSED WORDS</div>
      ${list}
    </div>
    <div style="padding:0 24px 34px;display:flex;gap:10px;">
      <button class="pill pill-outline" style="flex:1;padding:16px 0;font-size:15px;" onclick="goStats()">See stats</button>
      <button class="pill pill-primary" style="flex:1;padding:16px 0;font-size:15px;" onclick="goTestHub()">Done</button>
    </div>
  </div>`;
}

function screenStats(){
  const st = S.stats;
  const overallAcc = st.total ? Math.round(st.right/st.total*100)+'%' : '—';
  const typeStats = Object.keys(TYPES).map(k=>{
    const d = (st.byType||{})[k] || {right:0,total:0};
    const pct = d.total ? Math.round(d.right/d.total*100) : 0;
    return { label: d.total?pct+'%':'—', name:TYPES[k].name, color:TYPES[k].color, barH: (d.total? Math.max(pct,4):0) };
  });
  const wrongEntries = Object.entries(st.wrong||{}).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxWrong = wrongEntries.length ? wrongEntries[0][1] : 1;
  const history = (st.history||[]).map(h=>({pct:h.pct, label:h.label, h:Math.max(h.pct,4)}));

  const typeBars = typeStats.map(t=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px;">
      <div style="font-size:12px;font-weight:700;color:var(--navy);">${t.label}</div>
      <div style="width:100%;background:rgba(42,58,92,0.08);border-radius:6px 6px 0 0;height:74px;flex:none;display:flex;align-items:flex-end;overflow:hidden;"><div style="width:100%;height:${t.barH}%;background:${t.color};border-radius:6px 6px 0 0;"></div></div>
      <div style="font-size:10.5px;color:var(--sub);text-align:center;line-height:1.3;height:28px;flex:none;">${t.name}</div>
    </div>`).join('');

  const wrongList = wrongEntries.length ? wrongEntries.map(([w,n])=>`<div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;"><div class="serif" style="font-weight:700;font-size:15px;color:var(--navy);">${esc(w)}</div><div style="font-size:12px;color:var(--sub);">${n}x wrong</div></div>
      <div style="height:8px;background:rgba(42,58,92,0.08);border-radius:4px;overflow:hidden;"><div style="height:100%;background:var(--red);border-radius:4px;width:${Math.round(n/maxWrong*100)}%;"></div></div>
    </div>`).join('') : `<div style="font-size:13.5px;color:var(--sub);">No wrong answers recorded yet. Take a test to build your chart.</div>`;

  const histBars = history.length ? history.map(h=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;">
      <div style="font-size:10.5px;font-weight:700;color:var(--sub);">${h.pct}%</div>
      <div style="width:100%;background:rgba(42,58,92,0.08);border-radius:5px 5px 0 0;height:70px;flex:none;display:flex;align-items:flex-end;overflow:hidden;"><div style="width:100%;background:var(--navy);border-radius:5px 5px 0 0;height:${h.h}%;"></div></div>
      <div style="font-size:9.5px;color:var(--sub);height:14px;flex:none;">${esc(h.label)}</div>
    </div>`).join('') : `<div style="font-size:13.5px;color:var(--sub);align-self:center;">Your score history will appear here.</div>`;

  return `<div class="screen">
    <div class="header"><div><div class="htitle">PROGRESS</div><div class="hsub">Where you keep slipping</div></div></div>
    <div class="body">
      <div style="display:flex;gap:10px;">
        <div class="statbox"><div class="statnum">${st.tests||0}</div><div class="statlbl">TESTS TAKEN</div></div>
        <div class="statbox"><div class="statnum">${overallAcc}</div><div class="statlbl">ACCURACY</div></div>
        <div class="statbox"><div class="statnum" style="color:var(--orange);">${(st.queue||[]).length}</div><div class="statlbl">IN DRILL</div></div>
      </div>
      <div class="sectionlbl">ACCURACY BY QUESTION TYPE</div>
      <div style="background:var(--card);border-radius:16px;padding:20px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;height:170px;box-sizing:border-box;">${typeBars}</div>
      <div class="sectionlbl">MOST MISSED WORDS</div>
      <div style="background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;">${wrongList}</div>
      <div class="sectionlbl">RECENT SCORES</div>
      <div style="background:var(--card);border-radius:16px;padding:20px 18px;display:flex;align-items:flex-end;gap:8px;height:150px;box-sizing:border-box;">${histBars}</div>
      <button class="pill pill-outline" style="width:100%;margin-top:22px;padding:14px 0;font-size:13.5px;color:var(--sub);" onclick="if(confirm('Reset all progress?'))resetStats()">Reset all progress</button>
    </div>
    ${tabbar()}
  </div>`;
}

function screenReview(){
  if (!S.reviewOpen) return '';
  const active = !!S.rq;
  let inner;
  if (active){
    const opts = optionStyles(S.rq.choices, S.reviewLocked, S.reviewChosen);
    const canSpeak = S.rq.type==='meaning';
    inner = `<div style="font-size:13px;color:var(--sub);">${esc(S.rq.instruction)}</div>
      <div style="display:flex;align-items:center;gap:11px;margin-top:6px;">
        <div class="serif" style="font-weight:700;font-size:28px;color:var(--navy);line-height:1.25;">${esc(S.rq.prompt)}</div>
        ${canSpeak?`<button class="speakbtn" style="width:34px;height:34px;" onclick="speak('${esc(S.rq.word)}')">${SPEAK_ICON_D}</button>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:20px;">
        ${opts.map(o=>`<div class="opt ${o.cls}" style="padding:14px 15px;margin-bottom:0;" onclick="reviewAnswer(${o.id})"><div class="n">${o.num}</div><div class="t" style="font-size:14.5px;">${esc(o.text)}</div></div>`).join('')}
      </div>
      <div style="font-size:11.5px;color:var(--sub);margin-top:16px;line-height:1.5;">Get it right and it leaves the queue. Miss it and it moves to the back for later.</div>`;
  } else {
    inner = `<div style="padding:14px 0 4px;">
      <div class="serif" style="font-weight:700;font-size:24px;color:var(--navy);">Drill cleared</div>
      <div style="font-size:14px;color:var(--sub);margin-top:8px;line-height:1.55;">Five words cleared. ${(S.stats.queue||[]).length} still waiting in the queue.</div>
      <button class="pill pill-primary" style="width:100%;margin-top:20px;padding:15px 0;font-size:15px;" onclick="closeReview()">Close</button>
    </div>`;
  }
  return `<div class="modal-back center" style="z-index:30;">
    <div class="popcard">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <div style="font-size:11.5px;font-weight:700;letter-spacing:0.9px;color:var(--orange);">WRONG-ANSWER DRILL</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="serif" style="font-weight:700;font-size:14px;color:var(--sub);">${S.reviewCleared} / 5</div>
          <button style="border:none;background:transparent;cursor:pointer;padding:2px;display:flex;" onclick="closeReview()"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M1 1l11 11M12 1L1 12" stroke="#5B6B87" stroke-width="2" stroke-linecap="round"></path></svg></button>
        </div>
      </div>
      ${inner}
    </div>
  </div>`;
}

/* ============ MAIN RENDER ============ */
function render(){
  let html = '';
  switch(S.screen){
    case 'home': html = screenHome(); break;
    case 'sets': html = screenSets(); break;
    case 'lessons': html = screenLessons(); break;
    case 'words': html = screenWords(); break;
    case 'detail': html = screenDetail(); break;
    case 'testHub': html = screenTestHub(); break;
    case 'testPick': html = screenTestPick(); break;
    case 'testType': html = screenTestType(); break;
    case 'quiz': html = screenQuiz(); break;
    case 'result': html = screenResult(); break;
    case 'stats': html = screenStats(); break;
    default: html = screenHome();
  }
  html += screenReview();
  document.getElementById('phone').innerHTML = html;
}
render();
</script>
</body>
</html>
